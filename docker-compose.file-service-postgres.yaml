name: ofm-infra
services:
  file-service-postgres:
    image: postgres:17
    container_name: ofm-file-service-postgres
    hostname: file-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5440:5432"
    volumes:
      - file_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d file_service"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  file_service_postgres_data:
    name: infra_file_service_postgres_data
