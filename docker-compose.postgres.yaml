name: ofm-infra

services:
  user-service-redis:
    image: redis:8-alpine
    container_name: ofm-user-service-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [user_service_redis_data:/data]
  gig-service-redis:
    image: redis:8-alpine
    container_name: ofm-gig-service-redis
    restart: unless-stopped
    ports: ["6380:6379"]
    volumes: [gig_service_redis_data:/data]
  order-service-redis:
    image: redis:8-alpine
    container_name: ofm-order-service-redis
    restart: unless-stopped
    ports: ["6382:6379"]
    volumes: [order_service_redis_data:/data]
  payment-service-redis:
    image: redis:8-alpine
    container_name: ofm-payment-service-redis
    restart: unless-stopped
    ports: ["6381:6379"]
    volumes: [payment_service_redis_data:/data]
  review-service-redis:
    image: redis:8-alpine
    container_name: ofm-review-service-redis
    restart: unless-stopped
    ports: ["6384:6379"]
    volumes: [review_service_redis_data:/data]
  file-service-rustfs:
    image: rustfs/rustfs:latest
    container_name: ofm-file-service-rustfs
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9006:9000"
      - "9007:9001"
    volumes: [file_service_rustfs_data:/data]
  user-service-postgres:
    image: postgres:17
    container_name: ofm-user-service-postgres
    hostname: user-service-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment: {POSTGRES_DB: user_service, POSTGRES_USER: admin, POSTGRES_PASSWORD: admin}
    ports: ["5433:5432"]
    volumes: [user_service_postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U admin -d user_service], interval: 5s, timeout: 3s, retries: 20}
  auth-service-postgres:
    image: postgres:17
    container_name: ofm-auth-service-postgres
    hostname: auth-service-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment: {POSTGRES_DB: auth_service, POSTGRES_USER: admin, POSTGRES_PASSWORD: admin}
    ports: ["5434:5432"]
    volumes: [auth_service_postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U admin -d auth_service], interval: 5s, timeout: 3s, retries: 20}
  gig-service-postgres:
    image: postgres:17
    container_name: ofm-gig-service-postgres
    hostname: gig-service-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment: {POSTGRES_DB: gig_service, POSTGRES_USER: admin, POSTGRES_PASSWORD: admin}
    ports: ["5435:5432"]
    volumes: [gig_service_postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U admin -d gig_service], interval: 5s, timeout: 3s, retries: 20}
  order-service-postgres:
