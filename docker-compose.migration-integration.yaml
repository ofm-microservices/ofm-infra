name: ofm-infra-migration-integration

# The workspace may already have legacy PostgreSQL containers on 5433/5434.
# This override keeps the service containers unchanged and assigns deterministic
# migration-test host ports inside the approved Yugabyte range.
services:
  user-service-yugabyte:
    ports:
      - "5435:5433"
      - "7005:7000"
      - "9005:9000"
      - "15435:15433"
  auth-service-yugabyte:
    ports:
      - "5436:5433"
      - "7006:7000"
      - "9006:9000"
      - "15436:15433"
