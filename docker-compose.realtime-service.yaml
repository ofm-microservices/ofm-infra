services:
  realtime-service:
    build:
      context: ..
      dockerfile: ofm-realtime-service/Dockerfile
    container_name: ofm-realtime-service
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.00"
    environment:
      APP_NAME: realtime-service
      APP_ENV: local
      APP_OBSERVABILITY_MODE: dev
      HTTP_PORT: "8082"
      JWT_ACCESS_SECRET: aa96fae1a6eee39b879dad6b6bb372e63278257bf9f94010bc7d25693f61e38c
      KAFKA_BROKERS: ofm-migration-kafka:19092
      KAFKA_REALTIME_GROUP_ID: realtime-service
      KAFKA_CHAT_EVENTS_TOPIC: migration.chat-service.chat.changed
      REDIS_HOST: ofm-realtime-service-redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "150"
    ports:
      - "8082:8082"
      - "9610:9610"
    depends_on:
      kafka:
        condition: service_started
      realtime-service-redis:
        condition: service_healthy
