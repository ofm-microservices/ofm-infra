# The worker runs inside the migration Docker network.  kafka:19092 is the
# host-advertised listener and makes the worker resolve/connect through
# host.k3d.internal after a host reboot.  Use the internal Docker listener.
bootstrap.servers=kafka:19092
group.id=ofm-migration-connect
config.storage.topic=ofm-connect-configs
offset.storage.topic=ofm-connect-offsets
status.storage.topic=ofm-connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false
plugin.path=/kafka/connect,/kafka/connectors
rest.port=8083
