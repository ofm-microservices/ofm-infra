receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: deployment.environment
        from_attribute: service.env
        action: upsert
  transform/run-context:
    trace_statements:
      - context: span
        statements:
          - set(resource.attributes["test.run_id"], attributes["ofm.test_run_id"]) where attributes["ofm.test_run_id"] != nil
          - set(resource.attributes["test.scenario_id"], attributes["ofm.scenario_id"]) where attributes["ofm.scenario_id"] != nil

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/run-context, batch, resource]
      exporters: [otlp/tempo]
