{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/component: {{ $name }}
    {{- include "ofm.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
      {{- include "ofm.labels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $name }}
        {{- include "ofm.labels" $ | nindent 8 }}
      annotations:
        linkerd.io/inject: enabled
        {{- if $.Values.global.linkerd.skipOutboundPorts }}
        config.linkerd.io/skip-outbound-ports: "{{ $.Values.global.linkerd.skipOutboundPorts }}"
        {{- else if $.Values.global.nats.skipLinkerdOutbound }}
        config.linkerd.io/skip-outbound-ports: "{{ $.Values.global.nats.clientPort }}"
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 15
      hostAliases:
        - ip: {{ include "ofm.externalHost" $ | quote }}
          hostnames:
            - host.k3d.internal
            - kafka
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          resources:
            requests:
              cpu: {{ if eq $name "registration-saga-service" }}100m{{ else }}50m{{ end }}
              memory: {{ if eq $name "registration-saga-service" }}256Mi{{ else }}128Mi{{ end }}
            limits:
              cpu: {{ if eq $name "registration-saga-service" }}1000m{{ else }}500m{{ end }}
              memory: {{ if eq $name "registration-saga-service" }}512Mi{{ else }}256Mi{{ end }}
          env:
            - name: RETRY_ENABLED
              value: "true"
            - name: RETRY_MAX_ATTEMPTS
              value: "5"
            - name: RETRY_INITIAL_BACKOFF
              value: 100ms
            - name: RETRY_MAX_BACKOFF
              value: 30s
            - name: DLQ_ENABLED
              value: "true"
            - name: CIRCUIT_BREAKER_ENABLED
              value: "true"
            - name: CIRCUIT_BREAKER_FAILURE_THRESHOLD
              value: "5"
            - name: CIRCUIT_BREAKER_RESET_TIMEOUT
              value: 30s
            - name: CIRCUIT_BREAKER_CALL_TIMEOUT
              value: 15s
            {{- include "ofm.serviceEnv" (dict "serviceName" $name "Values" $.Values "Release" $.Release) | nindent 12 }}
---
{{- end }}
{{- end }}
