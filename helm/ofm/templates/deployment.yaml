{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/component: {{ $name }}
    {{- include "ofm.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
      {{- include "ofm.labels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $name }}
        {{- include "ofm.labels" $ | nindent 8 }}
      annotations:
        linkerd.io/inject: enabled
        # Make the injected proxy visible to the resource metrics API. Without
        # requests, CPU-based HPAs report missing metrics after node recovery.
        config.linkerd.io/proxy-cpu-request: 25m
        config.linkerd.io/proxy-cpu-limit: 250m
        config.linkerd.io/proxy-memory-request: 32Mi
        config.linkerd.io/proxy-memory-limit: 128Mi
        {{- if $.Values.global.linkerd.skipOutboundPorts }}
        config.linkerd.io/skip-outbound-ports: "{{ $.Values.global.linkerd.skipOutboundPorts }}"
        {{- else if $.Values.global.nats.skipLinkerdOutbound }}
        config.linkerd.io/skip-outbound-ports: "{{ $.Values.global.nats.clientPort }}"
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 15
      hostAliases:
        - ip: {{ include "ofm.externalHost" $ | quote }}
          hostnames:
            - host.k3d.internal
            - kafka
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          resources:
            requests:
              cpu: {{ if eq $name "monolith" }}250m{{ else if eq $name "registration-saga-service" }}100m{{ else }}50m{{ end }}
              memory: {{ if eq $name "monolith" }}512Mi{{ else if or (eq $name "registration-saga-service") (eq $name "gig-service") }}256Mi{{ else }}128Mi{{ end }}
            limits:
              cpu: {{ if or (eq $name "monolith") (eq $name "registration-saga-service") }}1000m{{ else }}500m{{ end }}
              memory: {{ if eq $name "monolith" }}1Gi{{ else if eq $name "registration-saga-service" }}512Mi{{ else if eq $name "gig-service" }}768Mi{{ else if eq $name "payment-service" }}512Mi{{ else }}256Mi{{ end }}
          env:
            - name: APP_OBSERVABILITY_MODE
              value: {{ $.Values.global.observabilityMode | default "production" | quote }}
            - name: RETRY_ENABLED
              value: "true"
            - name: RETRY_MAX_ATTEMPTS
              value: "9"
            - name: RETRY_INITIAL_BACKOFF
              value: 1s
            - name: RETRY_MAX_BACKOFF
              value: 5m
            - name: RETRY_BACKOFF_SCHEDULE
              value: "1s,5s,10s,30s,1m,2m,3m,5m"
            - name: DLQ_ENABLED
              value: "true"
            - name: CIRCUIT_BREAKER_ENABLED
              value: "true"
            - name: CIRCUIT_BREAKER_FAILURE_THRESHOLD
              value: "5"
            - name: CIRCUIT_BREAKER_RESET_TIMEOUT
              value: 30s
            - name: CIRCUIT_BREAKER_CALL_TIMEOUT
              # A dead dependency must fail before the public HTTP deadline so
              # the gateway can execute its compatibility fallback.
              value: 4s
            {{- include "ofm.serviceEnv" (dict "serviceName" $name "Values" $.Values "Release" $.Release) | nindent 12 }}
---
{{- end }}
{{- end }}
