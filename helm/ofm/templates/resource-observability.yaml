{{- if .Values.global.observability.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data, namespace: {{ .Values.global.namespace }}}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: {{ .Values.global.namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ofm-prometheus-resource-read}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps", "batch"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets", "jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ofm-prometheus-resource-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ofm-prometheus-resource-read}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: {{ .Values.global.namespace }}}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: {{ .Values.global.namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ofm-kube-state-metrics-read}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ofm-kube-state-metrics-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ofm-kube-state-metrics-read}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: {{ .Values.global.namespace }}}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-exporter, namespace: {{ .Values.global.namespace }}}
spec:
  selector: {matchLabels: {app: node-exporter}}
  template:
    metadata: {labels: {app: node-exporter}, annotations: {linkerd.io/inject: disabled}}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.9.1
          args: ["--path.rootfs=/host"]
          ports: [{name: metrics, containerPort: 9100}]
          volumeMounts: [{name: root, mountPath: /host, readOnly: true}]
      volumes: [{name: root, hostPath: {path: /}}]
---
apiVersion: v1
kind: Service
metadata: {name: node-exporter, namespace: {{ .Values.global.namespace }}}
spec: {selector: {app: node-exporter}, ports: [{name: metrics, port: 9100, targetPort: metrics}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: {{ .Values.global.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}, annotations: {linkerd.io/inject: disabled}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          ports: [{name: metrics, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: {{ .Values.global.namespace }}}
spec: {selector: {app: kube-state-metrics}, ports: [{name: metrics, port: 8080, targetPort: metrics}]}
{{- end }}
