global:
  namespace: ofm
  clusterDomain: cluster.local
  externalHost: 172.22.0.1
  natsHost: host.k3d.internal
  # Use the Docker host bridge explicitly so Kafka metadata never resolves to
  # the compose-only `kafka` name from inside k3d.
  kafkaHost: 172.22.0.1
  vector:
    enabled: true
    configRevision: "7"
    clickhouseEndpoint: http://clickhouse:8123
  observability:
    enabled: true
  hostDbBridge:
    enabled: false
  networkPolicy:
    enabled: false

_secrets:
  payment: {}
  mail: {}

services:
  monolith:
    enabled: true
    ingress:
      enabled: true
      host: monolith.ofm.local
      path: /
  api-gateway:
    enabled: true
  auth-service:
    enabled: true
  user-service:
    enabled: true
  registration-saga-service:
    enabled: true
  gig-service:
    enabled: true
  file-service:
    enabled: true
  chat-service:
    enabled: true
    scyllaPort: 9045
  payment-service:
    enabled: true
    ingress:
      enabled: true
      host: payment.ofm.local
      path: /
    stripe:
      fakeEnabled: true
      connectReturnURL: https://helene-unrealistic-thad.ngrok-free.dev/v1/freelancer/onboarding/return
      connectRefreshURL: https://helene-unrealistic-thad.ngrok-free.dev/v1/freelancer/onboarding/refresh
  review-service:
    enabled: true
  order-service:
    enabled: true
  order-saga-service:
    enabled: true
  realtime-service:
    enabled: true
  mail-service:
    enabled: true
  search-service:
    enabled: true
