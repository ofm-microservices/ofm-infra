global:
  # One HS256 access-token key is shared by auth-service, gateway and the
  # monolith v2 compatibility boundary in local Kubernetes.
  jwt:
    accessSecret: "aa96fae1a6eee39b879dad6b6bb372e63278257bf9f94010bc7d25693f61e38c"
    issuer: "ofm-auth-service"
  namespace: ofm
  # Transport request/event payload diagnostics are opt-in and intended for
  # local development only. Production values must override this to production.
  observabilityMode: production
  autoscaling:
    # Local development stays at one replica per workload; production can
    # enable autoscaling through a separate values file.
    enabled: false
    minReplicas: 1
    # Keep local clusters bounded so autoscaling cannot exhaust the developer
    # workstation. Service-specific overrides must not exceed this ceiling.
    maxReplicas: 3
    cpuUtilization: 70
    memoryUtilization: 80
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 0
  clusterDomain: cluster.local
  externalHost: 172.19.0.1
  natsHost: ""
  kafkaHost: ""
  nats:
    skipLinkerdOutbound: true
    clientPort: 4222
    monitorPort: 8222
  linkerd:
    # Host-published Redis/Kafka are infrastructure protocols, not HTTP traffic.
    # Keep them outside Linkerd interception; otherwise Redis claims can fail
    # with EOF and Kafka clients can fall back to misleading connection errors.
    skipOutboundPorts: "4222,5433,5434,5435,5436,5437,6379,6380,6381,6382,6385,6386,9006,9007,9042,9043,9044,9045,9092,9200"
  vector:
    enabled: false
    configRevision: "1"
    image: timberio/vector:0.47.0-alpine
    imagePullPolicy: IfNotPresent
    clickhouseEndpoint: ""
    clickhouseUser: admin
    clickhousePassword: admin
    clickhouseDatabase: default
    clickhouseTable: ofm_logs
  observability:
    enabled: false
    grafana:
      image: grafana/grafana:12.3.0
      plugins: grafana-clickhouse-datasource
    prometheus:
      image: prom/prometheus:v3.7.3
    tempo:
      image: grafana/tempo:2.10.0
    otelCollector:
      image: otel/opentelemetry-collector-contrib:0.120.0
    clickhouse:
      image: clickhouse/clickhouse-server:25.8

migrationFailureRelay:
  enabled: true
  image: ofm/migration-bridge:374ca812ed65
  schedule: "*/1 * * * *"
  databaseName: ofm_monolith
  databasePort: 5433
  batchLimit: 100
  hostDbBridge:
    enabled: false
  networkPolicy:
    enabled: false
  imagePullPolicy: IfNotPresent

services:
  monolith:
    enabled: true
    autoscaling:
      enabled: false
    stripe:
      fakeEnabled: false
    image: ofm/monolith:374ca812ed65
    replicaCount: 1
    ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
        protocol: TCP
      - name: metrics
        containerPort: 9600
        servicePort: 9600
        protocol: TCP

  api-gateway:
    enabled: true
    image: ofm/api-gateway:374ca812ed65
    replicaCount: 1
    ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
        protocol: TCP
      - name: metrics
        containerPort: 9606
        servicePort: 9606
        protocol: TCP
    ingress:
      enabled: true
      host: api.ofm.local
      path: /

  auth-service:
    enabled: true
    image: ofm/auth-service:374ca812ed65
    replicaCount: 1
    ports:
      - name: grpc
        containerPort: 9501
        servicePort: 9501
        protocol: TCP
      - name: metrics
        containerPort: 9601
        servicePort: 9601
        protocol: TCP

  user-service:
    enabled: true
    image: ofm/user-service:374ca812ed65
    replicaCount: 1
    ports:
      - name: grpc
        containerPort: 9502
        servicePort: 9502
        protocol: TCP
      - name: metrics
        containerPort: 9602
        servicePort: 9602
        protocol: TCP

  registration-saga-service:
    enabled: true
    image: ofm/registration-saga-service:374ca812ed65
    # Keep the local baseline below the HPA ceiling so a cold start does not
    # immediately consume more host resources than the development machine has.
    replicaCount: 1
    autoscaling:
      minReplicas: 2
      maxReplicas: 3
      cpuUtilization: 65
      memoryUtilization: 75
    ports:
      - name: grpc
        containerPort: 9500
        servicePort: 9500
        protocol: TCP
      - name: metrics
        containerPort: 9600
        servicePort: 9600
        protocol: TCP

  gig-service:
    enabled: true
    image: ofm/gig-service:374ca812ed65
    # Local Kafka projection topics are single-partition and the development
    # broker runs one node. Two replicas provide failover without causing the
    # repeated consumer-group rebalances seen with eight idle members.
    replicaCount: 2
    ports:
      - name: grpc
        containerPort: 9503
        servicePort: 9503
        protocol: TCP
      - name: metrics
        containerPort: 9603
        servicePort: 9603
        protocol: TCP

  file-service:
    enabled: true
    image: ofm/file-service:374ca812ed65
    replicaCount: 1
    ports:
      - name: grpc
        containerPort: 9504
        servicePort: 9504
        protocol: TCP
      - name: metrics
        containerPort: 9604
        servicePort: 9604
        protocol: TCP
    ingress:
      enabled: true
      host: file.ofm.local
      path: /
      grpc: true

  chat-service:
    enabled: true
    image: ofm/chat-service:374ca812ed65
    replicaCount: 1
    ports:
      - name: grpc
        containerPort: 9512
        servicePort: 9512
