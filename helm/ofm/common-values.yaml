global:
  namespace: ofm
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    cpuUtilization: 70
    memoryUtilization: 80
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 0
  clusterDomain: cluster.local
  externalHost: 172.19.0.1
  natsHost: ""
  kafkaHost: ""
  nats:
    skipLinkerdOutbound: true
    clientPort: 4222
    monitorPort: 8222
  linkerd:
    # Host-published Redis/Kafka are infrastructure protocols, not HTTP traffic.
    # Keep them outside Linkerd interception; otherwise Redis claims can fail
    # with EOF and Kafka clients can fall back to misleading connection errors.
    skipOutboundPorts: "4222,5433,5434,5435,5436,5437,6379,6380,6381,6382,6385,6386,9006,9007,9042,9043,9044,9045,9092,9200"
  vector:
    enabled: false
    configRevision: "1"
    image: timberio/vector:0.47.0-alpine
    imagePullPolicy: IfNotPresent
    clickhouseEndpoint: ""
    clickhouseUser: admin
    clickhousePassword: admin
    clickhouseDatabase: default
    clickhouseTable: ofm_logs
  observability:
    enabled: false
    grafana:
      image: grafana/grafana:12.3.0
      plugins: grafana-clickhouse-datasource
    prometheus:
      image: prom/prometheus:v3.7.3
    tempo:
      image: grafana/tempo:2.10.0
    otelCollector:
      image: otel/opentelemetry-collector-contrib:0.120.0
    clickhouse:
      image: clickhouse/clickhouse-server:25.8

migrationFailureRelay:
  enabled: true
  image: ofm/migration-bridge:1f6d32bf
  schedule: "*/1 * * * *"
  databaseName: ofm_monolith
  databasePort: 5433
  batchLimit: 100
  hostDbBridge:
    enabled: false
  networkPolicy:
    enabled: false
  imagePullPolicy: IfNotPresent

services:
  monolith:
    enabled: true
    autoscaling:
      enabled: false
    image: ofm/monolith:4a28fc55
    replicaCount: 1
    ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
        protocol: TCP
      - name: metrics
        containerPort: 9600
        servicePort: 9600
        protocol: TCP

  api-gateway:
    enabled: true
    image: ofm/api-gateway:83c4b7e2
