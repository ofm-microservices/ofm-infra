apiVersion: v1
kind: ServiceAccount
metadata: {name: load-test-service, namespace: ofm}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: load-test-service, namespace: ofm}
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, create, delete, patch]
- apiGroups: [""]
  resources: [pods, pods/log]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: load-test-service, namespace: ofm}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: load-test-service}
subjects: [{kind: ServiceAccount, name: load-test-service, namespace: ofm}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: load-test-service-metrics}
rules:
- apiGroups: [metrics.k8s.io]
  resources: [nodes]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: load-test-service-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: load-test-service-metrics}
subjects: [{kind: ServiceAccount, name: load-test-service, namespace: ofm}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: load-test-service, namespace: ofm}
spec:
  replicas: 1
  selector: {matchLabels: {app: load-test-service}}
  template:
    metadata: {labels: {app: load-test-service}}
    spec:
      serviceAccountName: load-test-service
      containers:
      - name: load-test-service
        image: ofm/load-test-service:a3551cd0
        imagePullPolicy: IfNotPresent
        env:
        - {name: RUNNER_NAMESPACE, value: ofm}
        - {name: K6_IMAGE, value: ofm/k6-full-system:resilience-dev8}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector:4318}
        - {name: CLICKHOUSE_URL, value: http://clickhouse:8123}
        - {name: CLICKHOUSE_USER, value: admin}
        - {name: CLICKHOUSE_PASSWORD, value: admin}
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: http}}
        livenessProbe: {httpGet: {path: /healthz, port: http}}
---
apiVersion: v1
kind: Service
metadata: {name: load-test-service, namespace: ofm}
spec:
  selector: {app: load-test-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: load-test-service, namespace: ofm}
spec:
  ingressClassName: traefik
  rules:
  - host: experiment-service.localhost
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: load-test-service, port: {name: http}}}}]}
  - host: experiment-service.ofm.local
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: load-test-service, port: {name: http}}}}]}
